<!DOCTYPE html>
<html>
<head>
    <title>Employee Registration Form</title>

    <style>
        table {
            width: 600px;
            margin: auto;
            border-collapse: collapse;
        }

        td {
            padding: 10px;
            border: 1px solid black;
        }

        tr:nth-child(odd) {
            background-color: #F0BAAF;
        }

        tr:nth-child(even) {
            background-color: #E3F29D;
        }
    </style>
</head>

<body>

    <h1 align="center">Employee Registration Form</h1>

    <form>

        <table>

            <tr>
                <td>Employee Name</td>
                <td>
                    <input type="text">
                </td>
            </tr>

            <tr>
                <td>Email ID</td>
                <td>
                    <input type="email">
                </td>
            </tr>

            <tr>
                <td>Password</td>
                <td>
                    <input type="password">
                </td>
            </tr>

            <tr>
                <td>Gender</td>
                <td>
                    <input type="radio" name="gender"> Male
                    <input type="radio" name="gender"> Female
                </td>
            </tr>

            <tr>
                <td>Date of Birth</td>
                <td>
                    <input type="date">
                </td>
            </tr>

            <tr>
                <td>Date of Joining</td>
                <td>
                    <input type="date">
                </td>
            </tr>

            <tr>
                <td>Address Line 1</td>
                <td>
                    <input type="text">
                </td>
            </tr>

            <tr>
                <td>Address Line 2</td>
                <td>
                    <input type="text">
                </td>
            </tr>

            <tr>
                <td>City</td>
                <td>
                    <input type="text">
                </td>
            </tr>

            <tr>
                <td>Pincode</td>
                <td>
                    <input type="number">
                </td>
            </tr>

            <tr>
                <td>Phone No</td>
                <td>
                    <input type="tel">
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Submit">
                    <input type="reset" value="Reset">
                </td>
            </tr>

        </table>

    </form>

</body>
</html>
